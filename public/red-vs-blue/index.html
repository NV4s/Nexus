<script>
(function () {
  var prefix = 'nexus:yg:' + location.pathname.split('/')[1] + ':';
  var load = function (key, fallback) { try { var v = localStorage.getItem(prefix + key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } };
  var save = function (key, value) { try { localStorage.setItem(prefix + key, JSON.stringify(value)); } catch (e) {} };
  var ok = function (value) { return Promise.resolve(value); };
  var no = function () { return Promise.reject(new Error('offline')); };
  var later = function (fn) { setTimeout(fn, 0); };
  var cb = function (options) { return (options && options.callbacks) || {}; };
  var player = {
    getName: function () { return 'Player'; },
    getPhoto: function () { return ''; },
    getAvatarSrc: function () { return ''; },
    getUniqueID: function () { return 'nexus-local'; },
    getPayingStatus: function () { return 'not_paying'; },
    getMode: function () { return 'lite'; },
    isAuthorized: function () { return false; },
    getData: function () { return ok(load('data', {})); },
    setData: function (data) { save('data', data); return ok(true); },
    getStats: function () { return ok(load('stats', {})); },
    setStats: function (stats) { save('stats', stats); return ok(true); },
    incrementStats: function (inc) { var s = load('stats', {}); for (var k in inc) s[k] = (s[k] || 0) + inc[k]; save('stats', s); return ok(s); }
  };
  var leaderboards = {
    getLeaderboardDescription: function () { return ok({ title: {}, description: {} }); },
    getLeaderboardEntries: function () { return ok({ entries: [], ranges: [], userRank: 0, leaderboard: {} }); },
    getLeaderboardPlayerEntry: no,
    setLeaderboardScore: function () { return ok(); }
  };
  var payments = {
    getCatalog: function () { return ok([]); },
    getPurchases: function () { return ok([]); },
    purchase: no,
    consumePurchase: function () { return ok(); }
  };
  var sdk = {
    environment: { i18n: { lang: 'en', tld: 'com' }, browser: { lang: (navigator.language || 'en').slice(0, 2) }, app: { id: 'nexus' }, payload: null },
    deviceInfo: {
      type: 'desktop',
      isDesktop: function () { return true; },
      isMobile: function () { return false; },
      isTablet: function () { return false; },
      isTV: function () { return false; }
    },
    adv: {
      showFullscreenAdv: function (o) { var c = cb(o); later(function () { if (c.onClose) c.onClose(false); }); },
      showRewardedVideo: function (o) { var c = cb(o); later(function () { if (c.onOpen) c.onOpen(); if (c.onRewarded) c.onRewarded(); if (c.onClose) c.onClose(); }); },
      showBannerAdv: function () { return ok({ stickyAdvIsShowing: false }); },
      hideBannerAdv: function () { return ok({ stickyAdvIsShowing: false }); },
      getBannerAdvStatus: function () { return ok({ stickyAdvIsShowing: false, reason: 'ADV_IS_NOT_CONNECTED' }); }
    },
    features: {
      LoadingAPI: { ready: function () {} },
      GameplayAPI: { start: function () {}, stop: function () {} },
      GamesAPI: { getAllGames: function () { return ok({ games: [], developerURL: '' }); }, getGameByID: no }
    },
    feedback: { canReview: function () { return ok({ value: false, reason: 'UNKNOWN' }); }, requestReview: function () { return ok({ feedbackSent: false }); } },
    shortcut: { canShowPrompt: function () { return ok({ canShow: false }); }, showPrompt: function () { return ok({ outcome: 'rejected' }); } },
    auth: { openAuthDialog: no },
    screen: { fullscreen: { status: 'off', request: function () { return ok(); }, exit: function () { return ok(); } } },
    getPlayer: function () { return ok(player); },
    getFlags: function () { return ok({}); },
    getPayments: function () { return ok(payments); },
    getLeaderboards: function () { return ok(leaderboards); }
  };
  window.YaGames = { init: function () { return ok(sdk); } };
})();
</script>

        function GetPayments() {
            try {
                if (payments != null) {

                        .then(products => {

                            let title = [];
                            let description = [];
                            let imageURI = [];
                            let priceValue = [];
                            let consumed = [];

                            payments.getPurchases().then(purchases => {
                                for (let i = 0; i < products.length; i++) {
                                    productID[i] = products[i].id;
                                    title[i] = products[i].title;
                                    description[i] = products[i].description;
                                    imageURI[i] = products[i].imageURI;
                                    priceValue[i] = products[i].priceValue;

                                    consumed[i] = true;
                                    for (i2 = 0; i2 < purchases.length; i2++) {
                                        if (purchases[i2].productID === productID[i]) {
                                            consumed[i] = false;
                                            break;
                                        }
                                    }
                                }

                                let jsonPayments = {
                                    "id": productID,
                                    "title": title,
                                    "description": description,
                                    "imageURI": imageURI,
                                    "priceValue": priceValue,
                                    "consumed": consumed
                                };

                                myGameInstance.SendMessage('YandexGame', 'PaymentsEntries', JSON.stringify(jsonPayments));
                            });
                        });
                }
                else if (callCount_GetPayments < 2) {
                    getPayments().
                        then(_payments => {
                            payments = _payments;
                            GetPayments();
                        });
                }
            } catch (e) {
                console.error('CRASH Get Payments: ', e.message);
            }

        function GetLeaderboardScores(nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
            try {
                var jsonEntries = {
                    technoName: '',
                    isDefault: false,
                    isInvertSortOrder: false,
                    decimalOffset: 0,
                    type: '' // , title: ''
                };

                ysdk.getLeaderboards()
                    .then(leaderboard => leaderboard.getLeaderboardDescription(nameLB))
                    .then(res => {
                        jsonEntries.technoName = nameLB;
                        jsonEntries.isDefault = res.default;
                        jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
                        jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
                        jsonEntries.type = res.description.type; // Не определяется на момент 18.07.23
                        //jsonEntries.title = res.title; // Реализуйте по предпочтениям

                        return leaderboard.getLeaderboardEntries(nameLB, {
                            quantityTop: quantityTop,
                            includeUser: auth,
                            quantityAround: quantityAround
                        });
                    })
                    .then(res => {
                        let jsonPlayers = EntriesLB(res, maxPlayers, photoSize);
                        let combinedJson = { ...jsonEntries, ...jsonPlayers };

                        myGameInstance.SendMessage('YandexGame', 'LeaderboardEntries', JSON.stringify(combinedJson));
                    })
                    .catch(error => {
                        console.error(error);
                    });
            }
            catch (e) {
                console.error('CRASH Get Leaderboard: ', e.message);
            }
        }

        function EntriesLB(res, maxPlayers, photoSize) {
            let LeaderboardEntriesText = '';
            let playersCount;

            if (res.entries.length < maxPlayers) {
                playersCount = res.entries.length;
            } else {
                playersCount = maxPlayers;
            }

            let ranks = new Array(playersCount);
            let photos = new Array(playersCount);
            let mames = new Array(playersCount);
            let scores = new Array(playersCount);
            let uniqueIDs = new Array(playersCount);

            for (i = 0; i < playersCount; i++) {
                ranks[i] = res.entries[i].rank;
                scores[i] = res.entries[i].score;
                uniqueIDs[i] = res.entries[i].player.uniqueID;

                if (photoSize === 'nonePhoto' || res.entries[i].player.scopePermissions.avatar !== "allow") {
                    photos[i] = 'nonePhoto';
                } else {
                    photos[i] = res.entries[i].player.getAvatarSrc(photoSize);
                }

                if (res.entries[i].player.scopePermissions.public_name !== "allow") {
                    mames[i] = "anonymous";
                } else {
                    mames[i] = res.entries[i].player.publicName;
                }

                LeaderboardEntriesText += ranks[i] + '. ' + mames[i] + ": " + scores[i] + '\n';
            }

            if (playersCount === 0) {
                LeaderboardEntriesText = 'no data';
            }

            let jsonPlayers = {
                "entries": LeaderboardEntriesText,
                "ranks": ranks,
                "photos": photos,
                "names": mames,
                "scores": scores,
                "uniqueIDs": uniqueIDs
            };

            return jsonPlayers;
        }

var cloudSaves = 'noData';

function SaveCloud(jsonData, flush) {
    if (player == null) {
        console.error('CRASH Save Cloud: ', 'Didnt have time to load');
        return;
    }
    try {
        player.setData({
            saves: [jsonData],
        }, flush);
    } catch (e) {
        console.error('CRASH Save Cloud: ', e.message);
    }
}

function LoadCloud(sendback) {
    return new Promise((resolve) => {
        if (ysdk == null) {
            if (sendback)
                myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
            resolve('noData');
            return;
        }
        try {
            ysdk.getPlayer({ scopes: false })
                .then(_player => {
                    _player.getData(["saves"]).then(data => {
                        if (data.saves) {
                            if (sendback)
                                myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', JSON.stringify(data.saves));
                            resolve(JSON.stringify(data.saves));
                        } else {
                            if (sendback)
                                myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                            resolve('noData');
                        }
                    }).catch(() => {
                        console.error('Load Cloud Error!');
                        if (sendback)
                            myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                        resolve('noData');
                    });
                }).catch(e => {
                    console.error('Load Cloud Error!', e.message);
                    if (sendback)
                        myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                    resolve('noData');
                });
        }
        catch (e) {
            console.error('CRASH Load saves Cloud: ', e.message);
            if (sendback)
                myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
            resolve('noData');
        }
    });
}

function RequestingEnvironmentData(sendback) {
    return new Promise((resolve, reject) => {
        if (ysdk == null) {
            resolve('');
            return;
        }
        try {
            var promptCanShow = false;
            var reviewCanShow = false;

            ysdk.feedback.canReview()
                .then(({ value }) => {
                    if (value)
                        reviewCanShow = true;

                    ysdk.shortcut.canShowPrompt().then(prompt => {
                        if (prompt.canShow)
                            promptCanShow = true;

                        let jsonEnvir = {
                            "language": ysdk.environment.i18n.lang,
                            "domain": ysdk.environment.i18n.tld,
                            "deviceType": ysdk.deviceInfo.type,
                            "isMobile": ysdk.deviceInfo.isMobile(),
                            "isDesktop": ysdk.deviceInfo.isDesktop(),
                            "isTablet": ysdk.deviceInfo.isTablet(),
                            "isTV": ysdk.deviceInfo.isTV(),
                            "appID": ysdk.environment.app.id,
                            "browserLang": ysdk.environment.browser.lang,
                            "payload": ysdk.environment.payload,
                            "promptCanShow": promptCanShow,
                            "reviewCanShow": reviewCanShow
                        };
                        if (sendback)
                            myGameInstance.SendMessage('YandexGame', 'SetEnvirData', JSON.stringify(jsonEnvir));
                        resolve(JSON.stringify(jsonEnvir));
                        console.log("Environment Data: " + JSON.stringify(jsonEnvir));
                    });
                });
        } catch (e) {
            console.error('CRASH Requesting Environment Data: ', e.message);
            reject(e);
        }
    });
}

            else {
                let _scopes = false;
                ysdk.getPlayer({ scopes: _scopes })
                    .then(_player => {
                        player = _player;

                        let playerName = player.getName();
                        let playerPhoto = player.getPhoto('small');

                        if (!_scopes) {
                            playerName = "anonymous";
                            playerPhoto = "null";
                        }

                        if (player.getMode() === 'lite') {

                            console.log('Not Authorized');
                            if (sendback)
                                myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                            resolve(NotAuthorized());
                        } else {
                            let authJson = {
                                "playerAuth": "resolved",
                                "playerName": playerName,
                                "playerId": player.getUniqueID(),
                                "playerPhoto": playerPhoto
                            };
                            if (sendback)
                                myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', JSON.stringify(authJson));
                            resolve(JSON.stringify(authJson));
                        }
                    }).catch(e => {
                        console.error('Authorized err: ', e.message);
                        if (sendback)
                            myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                        resolve(NotAuthorized());
                    });
            }
        } catch (e) {
            console.error('CRASH init Player: ', e.message);
            if (sendback)
                myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
            resolve(NotAuthorized());
        }
    });
}

function NotAuthorized() {
    let authJson = {
        "playerAuth": "rejected",
        "playerName": "unauthorized",
        "playerId": "unauthorized",
        "playerPhoto": "null"
    };
    return JSON.stringify(authJson);
}

function OpenAuthDialog() {
    if (ysdk !== null) {
        try {
            ysdk.auth.openAuthDialog().then(() => {
                InitPlayer(true)
                    .then(() => {
                        myGameInstance.SendMessage('YandexGame', 'GetDataInvoke');
                    });
            });
        } catch (e) {
            console.log('CRASH Open Auth Dialog: ', e.message);
        }
    }
}


let flasgsData = "null";

function GetFlags() {
    return new Promise((resolve) => {
        if (ysdk == null) {
            resolve('null');
            return;
        }
        try {
            ysdk.getFlags().then(flags => {
                let names = [];
                let values = [];

                for (let key in flags) {
                    if (flags.hasOwnProperty(key)) {
                        names.push(key);
                        values.push(flags[key]);
                    }
                }

                let jsonFlags = {
                    "names": names,
                    "values": values
                };

                resolve(JSON.stringify(jsonFlags));
            });
        } catch (e) {
            console.error('CRASH Get Flags: ', e.message);
            resolve('null');
        }
    });
}
