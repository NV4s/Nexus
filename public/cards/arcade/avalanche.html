<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalanche</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #ruffle-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
        .media-card { display: none; }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("/SWF Files/Avalanche.swf");
        });
    </script>

    <div class="media-card" data-category="Flash" data-title="Avalanche" data-url="/cards/arcade/avalanche.html">
      <div class="thumbnail-placeholder">
        <img src="/Card Thumbnails/Avalanche.png" alt="Avalanche" referrerpolicy="no-referrer" />
      </div>
      <div class="card-content">
        <h3 class="card-title">Avalanche</h3>
        <span class="card-category">Flash</span>
      </div>
      <div class="card-tooltip">
        <h4>Avalanche</h4>
        <div class="description-content">
          <p><strong>Developer:</strong> Unknown</p>
          <p><strong>Release Date:</strong> Unknown</p>
          <p><strong>Description:</strong> Avoid the falling blocks and climb as high as you can in this classic Flash game.</p>
        </div>
      </div>
    </div>
</body>
</html>
