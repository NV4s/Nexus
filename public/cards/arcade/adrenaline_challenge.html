<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrenaline Challenge</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #ruffle-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
        .media-card { display: none; }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("/SWF Files/Adrenaline.swf");
        });
    </script>

    <div class="media-card" data-category="Flash" data-title="Adrenaline Challenge" data-url="/cards/arcade/adrenaline_challenge.html">
      <div class="thumbnail-placeholder">
        <img src="/Card Thumbnails/adrenaline-challenge.png" alt="Adrenaline Challenge" referrerpolicy="no-referrer" />
      </div>
      <span class="category-tag">Flash</span>
      <h3>Adrenaline Challenge</h3>
      <div class="card-tooltip">
        <h4>Adrenaline Challenge</h4>
        <p><strong>Developer:</strong> Blackmaze and crazyMonkeyGames</p>
        <p><strong>Release Date:</strong> January 15th, 2007</p>
        <p><strong>Description:</strong> A challenging physics-based dirt bike game where you navigate complex levels to collect orbs and reach the finish point.</p>
      </div>
    </div>
</body>
</html>
