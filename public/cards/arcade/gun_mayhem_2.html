<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gun Mayhem 2</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #ruffle-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
        .media-card { display: none; }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("/SWF Files/Gun_Mayhem_2.swf");
        });
    </script>

    <div class="media-card" data-category="Flash" data-title="Gun Mayhem 2" data-url="/cards/arcade/gun_mayhem_2.html">
      <div class="thumbnail-placeholder">
        <img src="/Card Thumbnails/gun_mayhem_2.png" alt="Gun Mayhem 2" referrerpolicy="no-referrer" />
      </div>
      <span class="category-tag">Flash</span>
      <h3>Gun Mayhem 2</h3>
      <div class="card-tooltip">
        <h4>Gun Mayhem 2</h4>
        <p><strong>Developer:</strong> Kevin Gu</p>
        <p><strong>Release Date:</strong> 2012</p>
        <p><strong>Description:</strong> A fast-paced arena shooter where you battle friends or AI in chaotic levels using a massive arsenal of weapons to knock opponents off the map.</p>
      </div>
    </div>
</body>
</html>
