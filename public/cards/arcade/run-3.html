<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run 3</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #ruffle-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
        .media-card { display: none; }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("https://player03.com/run/3/Run3.swf");
        });
    </script>

    <div class="media-card" data-category="Flash" data-title="Run 3" data-url="/cards/arcade/run-3.html">
      <div class="thumbnail-placeholder">
        <img src="/Card Thumbnails/Run3_OG-logo.jpg" alt="Run 3" referrerpolicy="no-referrer" />
      </div>
      <span class="category-tag">Flash</span>
      <h3>Run 3</h3>
      <div class="card-tooltip">
        <h4>Run 3</h4>
        <p><strong>Developer:</strong> Player 03</p>
        <p><strong>Release Date:</strong> 2014</p>
        <p><strong>Description:</strong> An endless runner set in space. Navigate through tunnels and avoid falling into the void as a little alien.</p>
      </div>
    </div>
</body>
</html>
