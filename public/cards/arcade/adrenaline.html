<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrenaline</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #ruffle-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
        .media-card { display: none; }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("https://cdn.jsdelivr.net/gh/NV4s/swfdump@main/Adrenaline.swf");
        });
    </script>

    <div class="media-card" data-category="Flash" data-title="Adrenaline" data-url="/cards/arcade/adrenaline.html">
      <div class="thumbnail-placeholder code-placeholder">
        <code>
&lt;iframe src="https://YOUR_DOMAIN/cards/arcade/adrenaline.html" width="800" height="600" frameborder="0"&gt;&lt;/iframe&gt;
        </code>
      </div>
      <span class="category-tag">Flash</span>
      <h3>Adrenaline</h3>
      <div class="card-tooltip">
        <h4>Adrenaline</h4>
        <p><strong>Developer:</strong> Unknown</p>
        <p><strong>Release Date:</strong> 2008</p>
        <p><strong>Description:</strong> A high-octane classic flash game that tests your reflexes and speed to the absolute limit.</p>
      </div>
    </div>
</body>
</html>
