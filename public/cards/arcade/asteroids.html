<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #ruffle-container { width: 100%; height: 100%; }
        ruffle-player { width: 100%; height: 100%; }
        .media-card { display: none; }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("/SWF Files/Asteroids.swf");
        });
    </script>

    <div class="media-card" data-category="Flash" data-title="Asteroids" data-url="/cards/arcade/asteroids.html">
      <div class="thumbnail-placeholder">
        <img src="/Card Thumbnails/asteroids.png" alt="Asteroids" referrerpolicy="no-referrer" />
      </div>
      <span class="category-tag">Flash</span>
      <h3>Asteroids</h3>
      <div class="card-tooltip">
        <h4>Asteroids</h4>
        <p><strong>Developer:</strong> Atari, Inc.</p>
        <p><strong>Release Date:</strong> November 1979</p>
        <p><strong>Description:</strong> A classic arcade space shooter where you control a spaceship in an asteroid field, destroying asteroids and flying saucers while avoiding collisions.</p>
      </div>
    </div>
</body>
</html>
