<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crisis Point — Rail Shooter</title>
<style>
  :root {
    --bg: #05070d;
    --ink: #e6f1ff;
    --amber: #ffb020;
    --cyan: #35e0ff;
    --red: #ff2f4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9;
    cursor: none;
    touch-action: none;
    background: #05070d;
  }
  /* Pointer returns outside the play state so menus stay usable. */
  canvas.showcursor { cursor: default; }
  #selftest {
    position: fixed;
    inset: 0;
    padding: 24px;
    overflow: auto;
    background: #05070d;
    font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script type="module" src="./main.js"></script>
</body>
</html>
