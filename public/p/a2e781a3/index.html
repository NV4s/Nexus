<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>GTA Simulator</title>
<link rel="stylesheet" href="TemplateData/style.css">
<script src="TemplateData/UnityProgress.js"></script>
<script src="Build/UnityLoader.js"></script>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
.webgl-content, #gameContainer { position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; transform: none !important; }
</style>
<script>
function SubmitLeaderboardScore() {}
function GetLeaderboardEntries() {}
function InitApi() {}
function InitExternEval() {}
function ExternEval() {}
function ExternEvalResumeGame() {}
function RewardedReady() {}
function RewardedSuccess() {}
function RewardedFail() {}
function RewardedClose() {}
function PreloadRewarded() {
  if (window.gameInstance) gameInstance.SendMessage('FreezeNovaAPI', 'RewardedReady');
}
function ShowRewarded() {
  if (!window.gameInstance) return;
  gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onOpen');
  gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'RewardedOnRewarded');
  gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
}
</script>
</head>
<body>
<div class="webgl-content"><div id="gameContainer"></div></div>
<script>var gameInstance = UnityLoader.instantiate("gameContainer", "Build/game.json", { onProgress: UnityProgress });</script>
</body>
</html>
